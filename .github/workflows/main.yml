name: Build EndAnimation Fabric

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'

      - name: Unpack and locate project
        id: proj
        run: |
          if [ -f build.gradle ]; then
            echo "dir=." >> "$GITHUB_OUTPUT"
          else
            Z=$(find . -maxdepth 2 -iname 'EndAnimationFabric*.zip' | head -1)
            [ -n "$Z" ] || { echo "Нет build.gradle и нет EndAnimationFabric.zip" >&2; exit 1; }
            unzip -oq "$Z" -d _src
            P=$(find _src -name build.gradle | head -1)
            echo "dir=$(dirname "$P")" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        working-directory: ${{ steps.proj.outputs.dir }}
        run: |
          gradle build --no-daemon
          rm -f build/libs/*-sources.jar

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: EndAnimation-fabric-jar
          path: ${{ steps.proj.outputs.dir }}/build/libs/*.jar

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: fabric-build-${{ github.run_number }}
          name: EndAnimation Fabric 1.20.1 build ${{ github.run_number }}
          files: ${{ steps.proj.outputs.dir }}/build/libs/*.jar
