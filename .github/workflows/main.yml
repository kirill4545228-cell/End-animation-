name: Build EndAnimation

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Unpack and locate project
        id: proj
        run: |
          if [ -f pom.xml ]; then
            echo "dir=." >> "$GITHUB_OUTPUT"
          else
            Z=$(find . -maxdepth 2 -iname 'EndAnimation*.zip' | head -1)
            [ -n "$Z" ] || { echo "Нет pom.xml и нет EndAnimation.zip" >&2; exit 1; }
            unzip -oq "$Z" -d _src
            P=$(find _src -name pom.xml | head -1)
            echo "dir=$(dirname "$P")" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        working-directory: ${{ steps.proj.outputs.dir }}
        run: mvn -B clean package

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: EndAnimation-jar
          path: ${{ steps.proj.outputs.dir }}/target/EndAnimation-*.jar

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: EndAnimation build ${{ github.run_number }}
          files: ${{ steps.proj.outputs.dir }}/target/EndAnimation-*.jar
